<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦麦省心凑单</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><a class="brand" href="/">麦麦省心凑单</a><span class="header-note">非官方比价工具</span></header>
<main><section class="order-bar"><div class="location"><strong id="store">演示门店</strong><span id="address">模拟价格</span></div><div class="segmented" aria-label="用餐方式"><button data-mode="pickup" aria-pressed="true">到店取餐</button><button data-mode="delivery" aria-pressed="false">麦乐送</button><button data-mode="both" aria-pressed="false">一起比</button></div><div class="source-control"><select id="source" aria-label="比较数据"><option value="demo">演示模式</option><option value="live">实时比价</option></select></div></section>
<div class="workspace"><section class="builder panel"><div class="section-heading"><h1>选你想吃的</h1><div><button id="reset" class="text-button">示例</button><button id="clear" class="text-button">清空</button></div></div><div class="menu-search"><input id="search" type="search" placeholder="搜索餐品" aria-label="搜索餐品"></div><nav class="categories" aria-label="餐品分类"><button data-category="all" aria-pressed="true">全部</button><button data-category="burger" aria-pressed="false">汉堡</button><button data-category="snack" aria-pressed="false">小食</button><button data-category="drink" aria-pressed="false">饮品</button><button data-category="dessert" aria-pressed="false">甜品</button><button data-category="selected" aria-pressed="false">已选</button></nav><div id="food-list" class="food-list"></div><div class="basket-controls"><label class="extra-toggle"><span>多 1 份更便宜也看看</span><input id="extras" type="checkbox" role="switch" checked></label><div class="checkout"><div><strong id="item-count">已选 4 份</strong><span>只比价，不下单</span></div><button id="compare" class="primary">开始比价</button></div></div></section>
<section class="results"><div class="section-heading result-heading"><h2>怎么买更划算</h2><span id="data-tag" class="tag">模拟价格</span></div><div id="status" role="status" aria-live="polite"></div><div id="result-content"><div class="empty panel"><span class="empty-bag" aria-hidden="true">＋</span><h2>选好了？算一算</h2><p>单点、套餐、已有券一起比</p></div></div></section></div>
<footer id="catalog-note">正在加载餐品…</footer></main></body></html>
